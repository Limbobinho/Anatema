<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ANATEMA — Ficha de Personagem</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Caveat:wght@500;600;700&family=Special+Elite&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="watching-eyes" aria-hidden="true">
        <div class="watching-eye eye-a"><span class="eye-pupil"></span></div>
        <div class="watching-eye eye-b"><span class="eye-pupil"></span></div>
        <div class="watching-eye eye-c"><span class="eye-pupil"></span></div>
        <div class="watching-eye eye-d"><span class="eye-pupil"></span></div>
    </div>

    <!-- =========================================================
         BARRA SUPERIOR
         ========================================================= -->

    <header class="toolbar">

        <button id="btnExportar" type="button">
            Exportar
        </button>

        <label class="btnImportar">
            Importar
            <input type="file"
                   id="inputImportar"
                   accept="application/json"
                   hidden>
        </label>

        <span class="status" id="status"></span>

    </header>


    <!-- =========================================================
         NAVEGADOR DE FICHAS
         ========================================================= -->

    <nav class="sheet-tabs-wrap"
         id="sheetTabsWrap"
         aria-label="Fichas abertas">

        <div class="sheet-tabs"
             id="sheetTabs"></div>

        <button class="tab-add"
                id="btnNovaFicha"
                type="button"
                title="Criar nova ficha"
                aria-label="Criar nova ficha">
            +
        </button>

    </nav>


    <!-- =========================================================
         PÁGINA INICIAL
         ========================================================= -->

    <main class="home-screen"
          id="homeScreen">

        <div class="home-frame">

            <div class="home-ornament top">
                ── ◆ ──
            </div>

            <div class="home-emblem">

                <div class="home-emblem-shape">

                    <div class="home-emblem-circle"></div>

                    <div class="home-emblem-cross-v"></div>
                    <div class="home-emblem-cross-h"></div>

                </div>

            </div>

            <div class="home-title">
                ANATEMA
            </div>

            <div class="home-subtitle">
                FICHAS DE PERSONAGEM
            </div>

            <div class="home-divider">
                †
            </div>

            <div class="home-actions">

                <button id="btnHomeNovaFicha"
                        type="button"
                        class="home-button">
                    Criar nova ficha
                </button>

                <label class="home-button home-import-button">
                    Importar ficha

                    <input type="file"
                           id="inputImportarHome"
                           accept="application/json"
                           hidden>
                </label>

            </div>

            <div class="home-ornament bottom">
                ✦
            </div>

        </div>

    </main>


    <!-- =========================================================
         FICHA
         ========================================================= -->

    <main class="sheet"
          id="characterSheet"
          hidden>

        <div class="corner corner-tl"></div>
        <div class="corner corner-tr"></div>
        <div class="corner corner-bl"></div>
        <div class="corner corner-br"></div>


        <!-- =======================================================
             COLUNA ESQUERDA
             ======================================================= -->

        <section class="col col-left">

            <!-- NOME -->

            <div class="field-row">

                <label class="field field-name">

                    <span class="tag">
                        Nome
                    </span>

                    <span class="field-symbol">
                        ✦
                    </span>

                    <input type="text"
                           id="nome"
                           placeholder="nome do personagem"
                           autocomplete="off">

                </label>

            </div>


            <!-- JOGADOR -->

            <div class="field-row">

                <label class="field field-name">

                    <span class="tag">
                        Jogador
                    </span>

                    <span class="field-symbol">
                        ✦
                    </span>

                    <input type="text"
                           id="jogador"
                           placeholder="nome do jogador"
                           autocomplete="off">

                </label>

            </div>


            <!-- VIDA / DEFESA -->

            <div class="stat-row">

                <div class="stat-box">

                    <span class="stat-label">
                        Vida
                    </span>

                    <div class="ornament-line"></div>

                    <div class="stat-values">

                        <div class="stat-value-group">

                            <span class="stat-minmax">
                                Min
                            </span>

                            <input type="number"
                                   id="vidaAtual"
                                   class="stat-input"
                                   min="0">

                        </div>

                        <span class="stat-sep">
                            /
                        </span>

                        <div class="stat-value-group">

                            <span class="stat-minmax">
                                Máx
                            </span>

                            <input type="number"
                                   id="vidaMax"
                                   class="stat-input"
                                   min="0">

                        </div>

                    </div>

                </div>


                <div class="stat-box">

                    <span class="stat-label">
                        Defesa
                    </span>

                    <div class="ornament-line"></div>

                    <div class="stat-values">

                        <input type="number"
                               id="defesa"
                               class="stat-input stat-input-single"
                               min="0">

                    </div>

                </div>

            </div>


            <!-- AFLIÇÃO -->

            <div class="aflicao-box">

                <span class="aflicao-title">
                    Aflição
                </span>

                <div class="aflicao-decoration">
                    ◆
                </div>

                <div class="aflicao-pips"
                     id="aflicaoGrid"></div>

            </div>


            <!-- APTIDÕES -->

            <div class="section">

                <h2 class="section-title">
                    <span>✦</span>
                    Aptidões
                    <span>✦</span>
                </h2>

                <div class="aptidoes-grid"
                     id="aptidoesGrid"></div>

            </div>


            <!-- INVENTÁRIO -->

            <div class="section">

                <h2 class="section-title">
                    <span>✦</span>
                    Inventário
                    <span>✦</span>
                </h2>

                <div class="inventario">

                    <div class="backpack-header">

                        <span class="weight-total">
                            Peso carregado: <strong id="pesoTotal">0</strong>
                        </span>

                        <button type="button"
                                class="backpack-add"
                                id="btnAdicionarSlot"
                                title="Adicionar item"
                                aria-label="Adicionar item">
                            +
                        </button>

                    </div>

                    <div class="mochila-list"
                         id="mochilaGrid"></div>

                </div>

            </div>

        </section>


        <!-- =======================================================
             COLUNA DIREITA
             ======================================================= -->

        <section class="col col-right">

            <div class="right-panel">


                <!-- VANTAGENS -->

                <div class="section">

                    <h2 class="section-title">
                        <span>✦</span>
                        Vantagens
                        <span>✦</span>
                    </h2>

                    <textarea class="panel-textarea"
                              id="vantagens"
                              placeholder="talentos, poderes, rituais..."></textarea>

                </div>


                <!-- EMBLEMA -->

                <div class="emblem"
                     aria-hidden="true">

                    <div class="emblem-top">
                        ── ◆ ──
                    </div>

                    <div class="emblem-symbol">

                        <div class="emblem-circle"></div>

                        <div class="emblem-cross-v"></div>
                        <div class="emblem-cross-h"></div>

                    </div>

                    <div class="emblem-title">
                        ANATEMA
                    </div>

                    <div class="emblem-bottom">
                        ✦
                    </div>

                </div>


                <!-- ANOTAÇÕES -->

                <div class="section notes-section">

                    <h2 class="section-title">
                        <span>✦</span>
                        Anotações
                        <span>✦</span>
                    </h2>

                    <textarea class="panel-textarea notes"
                              id="anotacoes"
                              placeholder="anotações livres..."></textarea>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
